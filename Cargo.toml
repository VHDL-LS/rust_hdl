[workspace]
resolver = "3"
members = [
    "vhdl_lang_macros",
    "vhdl_lang",
    "vhdl_ls",
    "vhdl_syntax",
    "xtask",
    "vhdl-dump-ast",
]

# By default, do not include members that are only needed at build-time
# e.g., (vhdl_lang_macros, xtask)
default-members = ["vhdl_lang", "vhdl_ls", "vhdl_syntax", "vhdl-dump-ast"]

[workspace.package]
version = "0.88.0"
authors = ["Olof Kraigher <olof.kraigher@gmail.com>"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/VHDL-LS/rust_hdl"
readme = "README.md"

[workspace.dependencies]
# Workspace crates
vhdl_lang = { version = "^0.88.0", path = "vhdl_lang" }
vhdl_lang_macros = { version = "^0.88.0", path = "vhdl_lang_macros" }
vhdl_syntax = { version = "0.2.0", path = "vhdl_syntax" }

anyhow = "1.0.52"
clap = { version = "4.1.14", features = ["derive"] }
convert_case = "0.12"
dirs = "7"
dunce = "1"
enum-map = "3.1.0"
env_logger = "0.11.8"
fnv = "1.0.5"
fuzzy-matcher = "0.3.7"
glob = "0.3.2"
itertools = "0.15"
log = "0.4.27"
lsp-types = "^0.95.1"
lsp-server = "0.10.0"
nonzero_ext = "0.3.0"
parking_lot = "0.12.3"
pinned_vec = "0.1.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rayon = "1.0.3"
rustc-hash = "2.1.3"
serde = "1.0.219"
serde_json = "1.0.140"
serde_yaml_bw = "2.5.1"
strum = { version = "0.28", features = ["derive"] }
subst = "0.3.8"
syn = { version = "3.0.2", features = ["full"] }
toml = "0.8.23"
ungrammar = "1.16.1"


# Dev dependencies
assert_cmd = "2.0.17"
assert_matches = "1.5.0"
brunch = "0.11"
insta = "1.36"
predicates = "3.1.0"
pretty_assertions = "1"
regex = "1.10.5"
similar = "3.1.2"
tempfile = "3"
