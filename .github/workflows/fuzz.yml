name: Fuzz

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzzing time in seconds'
        required: false
        default: '1800'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: '0.13.2'

jobs:
  fuzz:
    name: Fuzz the parser
    # Do not run the job in forks
    if: ${{ github.repository == 'VHDL-LS/rust_hdl' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fuzz-

      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version ${{ env.CARGO_FUZZ_VERSION }} --locked

      - name: Restore corpus
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: fuzz/corpus/parser
          key: fuzz-corpus-parser-${{ github.run_id }}
          restore-keys: fuzz-corpus-parser-

      - name: Fuzz
        working-directory: fuzz
        env:
          DURATION: ${{ github.event.inputs.duration || '1800' }}
        run: |
          mkdir -p corpus/parser
          cargo fuzz run parser corpus/parser seeds/parser -- \
            -dict=vhdl.dict \
            -max_total_time="$DURATION" \
            -timeout=25 \
            -rss_limit_mb=4096 \
            -print_final_stats=1

      - name: Minimize corpus
        if: success()
        working-directory: fuzz
        run: cargo fuzz cmin parser corpus/parser

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-artifacts-parser
          path: fuzz/artifacts/parser
          if-no-files-found: warn

  fuzz-structured:
    name: Fuzz ${{ matrix.target }}
    # Do not run the job in forks
    if: ${{ github.repository == 'VHDL-LS/rust_hdl' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        target: [grammar, lrm]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fuzz-

      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version ${{ env.CARGO_FUZZ_VERSION }} --locked

      # These targets generate their input from structured data, so neither a
      # persisted corpus nor the VHDL dictionary is of any use to them.
      - name: Fuzz
        working-directory: fuzz
        env:
          DURATION: ${{ github.event.inputs.duration || '1800' }}
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time="$DURATION" \
            -timeout=25 \
            -rss_limit_mb=4096 \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: warn
